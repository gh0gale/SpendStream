# Every push and pull request runs every test that needs no secrets
# (docs/SYSTEM_AUDIT_AND_PLAN.md Phase 3). Nothing here touches Supabase,
# Google or the network beyond installing packages.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # the Docker image's version
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install (exact versions from the lockfile)
        run: pip install -r requirements.lock ruff coverage pip-audit

      # Errors only (syntax, undefined names), not style: the code predates ruff.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .

      # The real model is private (Supabase Storage, not git). A model trained
      # on the public templates alone is enough for the offline tests.
      - name: Templates-only model (no private data)
        run: python train_model.py --no-smoke

      - name: Offline tests with coverage
        run: sh run_tests.sh

      - name: Coverage report
        if: always()
        run: coverage report --include="main.py,tasks.py,etl.py,gmail_parser.py,merchant_identity.py,config.py,token_crypto.py,weekly_retrain.py,model_store.py"

      - name: Dependency audit
        run: pip-audit -r requirements.lock

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and row-level security on a throwaway Postgres
        run: sh supabase/tests/run_local.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Dependency audit (shipped packages only)
        run: npm audit --omit=dev --audit-level=high
