# Scheduled Gmail sync for every connected user (plan Phase 7).
#
# Calls the deployed backend's POST /cron/fetch-all three times a day. Each
# run also keeps the free Supabase project awake (it pauses after 7 days with
# no database activity) and wakes the free Render service.
#
# Needs two repository secrets (docs/USER_TODO.md):
#   BACKEND_URL   the deployed backend, e.g. https://<your-service>.onrender.com
#   CRON_SECRET   the same value as the backend's CRON_SECRET
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without repository activity; if syncing stops, check the Actions tab first.

name: Scheduled sync

on:
  schedule:
    - cron: "30 2,8,17 * * *"   # 08:00, 14:00 and 23:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the secrets are set
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BACKEND_URL and CRON_SECRET repository secrets are required (docs/USER_TODO.md)."
            exit 1
          fi

      # A sleeping free instance takes up to about a minute to start, so
      # wait for /health before asking for the sync.
      - name: Wake the backend and check the database
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 60 "$BACKEND_URL/health"

      - name: Start the sync for all connected users
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
                 -X POST -H "X-Cron-Secret: $CRON_SECRET" "$BACKEND_URL/cron/fetch-all")
          echo "POST /cron/fetch-all -> $code"
          [ "$code" = "202" ]
